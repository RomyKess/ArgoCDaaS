{{- if and (eq .Values.drType "full") (eq .Values.global.clusterType "passive") }}
kind: ConfigMap
apiVersion: v1
metadata:
  name: argocd-restore-configmap
  namespace: gitops-{{ .Values.name }}
data:
  restore-script.sh: |
    #!/bin/bash
    cd ..
    BUCKET={{ tpl .Values.backup.hostBucket . }}
    DEST_DIR=/tmp/snapshot
    ALL=$(s3cmd ls s3://$BUCKET | grep -e 'yaml$')
    NEW=$(echo "$ALL" | sort -k4,4 | tail -n 1 | awk '{print $4}')

    s3cmd get $NEW $DEST_DIR || exit 1
    echo "Finished downloading snapshot from s3"
    mv $DEST_DIR/* $DEST_DIR/backup_without_label.yaml

  s3cfg: |
    [default]
    access_key = $AWS_ACCESS_KEY_ID
    bucket_location = $AWS_DEFAULT_REGION
    host_base = $AWS_HOST_BASE
    host_bucketc = {{ tpl .Values.backup.hostBucket . }}
    secret_key = $AWS_SECRET_ACCESS_KEY
    signature_v2 = True
---
{{- end }}
